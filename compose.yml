name: webshop-lab
services:
  db:
    build: ./docker/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Ange MYSQL_ROOT_PASSWORD i .env}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: webshop
      MYSQL_USER: webshop
      MYSQL_PASSWORD: ${SHOP_DB_PASSWORD:?Ange SHOP_DB_PASSWORD i .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=webshop --database=webshop --execute="SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  web:
    build: .
    environment:
      SHOP_DB_URL: jdbc:mysql://db:3306/webshop?connectionTimeZone=%2B00:00&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
      SHOP_DB_USER: webshop
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:?Ange SHOP_DB_PASSWORD i .env}
    ports:
      - "127.0.0.1:${SHOP_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/webshop/login"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql-data:
