name: JDK 25 och MySQL
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Skapa tillfällig Docker-konfiguration
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_root_only_password
          SHOP_DB_PASSWORD=ci_app_only_password
          SHOP_HTTP_PORT=8080
          MYSQL_HOST_PORT=3307
          EOF
          docker compose config --quiet
      - name: Bygg och starta Tomcat och MySQL
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Kontrollera JDK 25 och Tomcat 10.1 i webbcontainern
        run: |
          shop_java_version="$(docker compose exec -T web java -version 2>&1)"
          printf '%s\n' "$shop_java_version"
          [[ "$shop_java_version" == *'version "25.'* ]]
          shop_tomcat_version="$(docker compose exec -T web catalina.sh version)"
          printf '%s\n' "$shop_tomcat_version"
          [[ "$shop_tomcat_version" == *'Apache Tomcat/10.1.60'* ]]
      - name: Visa loggar vid fel
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stoppa tillfälliga CI-containrar
        if: always()
        run: docker compose down --volumes
  platform-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Bygg WAR på Mac och Windows
        run: mvn --batch-mode clean package
